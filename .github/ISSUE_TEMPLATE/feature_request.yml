name: Feature request / 功能建议
description: Suggest a focused improvement to comment-region display.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: Describe the reading or installation task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Describe the smallest change that would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / 补充说明
      description: Optional public examples. Do not include private data.
