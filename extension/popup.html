<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bili IP Lens</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="14" cy="14" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M5 14h18M14 5c4 5 4 13 0 18-4-5-4-13 0-18ZM21 21l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <div>
          <h1>Bili IP Lens</h1>
          <p class="subtitle">B站评论 IP 属地</p>
        </div>
      </header>

      <section class="setting" aria-labelledby="toggle-label">
        <div class="setting-row">
          <div class="setting-copy">
            <h2 id="toggle-label">显示 IP 属地</h2>
            <p id="toggle-hint">切换即时生效</p>
          </div>
          <button id="enabled-toggle" class="toggle" type="button" role="switch" aria-checked="false" aria-labelledby="toggle-label" aria-describedby="toggle-hint" disabled>
            <span class="toggle-thumb" aria-hidden="true"></span>
          </button>
        </div>
        <div class="state-row">
          <span id="state" class="state" data-enabled="false"><span class="state-dot" aria-hidden="true"></span><span id="state-text">正在读取设置</span></span>
          <span class="instant-note" aria-hidden="true">无需刷新</span>
        </div>
      </section>

      <div class="page-status" aria-live="polite" aria-atomic="true">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 7h7M6.5 10h7M6.5 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <p id="page-status">正在读取设置…</p>
      </div>
      <p id="feedback" class="feedback" role="status" hidden></p>

      <aside class="privacy-note">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m10 2.5 6 2v4.8c0 3.2-2.3 6.1-6 8.2-3.7-2.1-6-5-6-8.2V4.5l6-2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m7 9.5 2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>只显示 B站已有的属地信息。<br><span>不额外查询 IP，不上传浏览数据。</span></p>
      </aside>

      <footer><span>轻一点，看清一点。</span><span id="version">v0.1.1</span></footer>
    </main>
  </body>
</html>
